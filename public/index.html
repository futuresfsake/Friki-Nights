<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Friki Nights - Real-time chat for night owls and geeks. Jump in and start chatting!">
  <meta property="og:title" content="Friki Nights">
  <meta property="og:description" content="Real-time chat for night owls & geeks">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#7c3aed">
  <title>Friki Nights</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Join Screen -->
  <div id="join-screen" class="screen">
    <div class="join-container">
      <div class="logo">
        <span class="logo-icon">🎮</span>
        <h1>Friki Nights</h1>
        <p>Real-time chat for night owls & geeks</p>
      </div>
      <form id="join-form">
        <input type="text" id="username-input" placeholder="Pick a username..." maxlength="20" autocomplete="off" required>
        <button type="submit">Join Chat</button>
      </form>
    </div>
  </div>

  <!-- Chat Screen -->
  <div id="chat-screen" class="screen hidden">
    <header>
      <div class="header-left">
        <button id="sidebar-toggle" class="mobile-only" aria-label="Toggle sidebar">&#9776;</button>
        <span class="logo-icon-sm">🎮</span>
        <h2>Friki Nights</h2>
      </div>
      <div class="header-right">
        <span id="connection-status" class="status-connected" title="Connected">&#9679;</span>
        <span id="user-count">0 online</span>
        <button id="sound-toggle" title="Toggle notification sound">&#128264;</button>
        <button id="theme-toggle" title="Toggle theme">&#9789;</button>
      </div>
    </header>

    <div class="chat-layout">
      <div id="sidebar-overlay"></div>
      <!-- Sidebar -->
      <aside id="sidebar">
        <h3>Online</h3>
        <ul id="user-list"></ul>
      </aside>

      <!-- Main Chat -->
      <main>
        <div id="messages"></div>
        <button id="scroll-bottom-btn" class="hidden" aria-label="Scroll to bottom">&darr;</button>
        <div id="typing-indicator" class="hidden"></div>
        <form id="message-form">
          <div class="input-wrapper">
            <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off" maxlength="1000">
            <span id="char-count" class="char-count">0/1000</span>
          </div>
          <button type="submit">Send</button>
        </form>
      </main>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
