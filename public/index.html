<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Friki Nights</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Join Screen -->
  <div id="join-screen" class="screen">
    <div class="join-container">
      <div class="logo">
        <span class="logo-icon">🎮</span>
        <h1>Friki Nights</h1>
        <p>Real-time chat for night owls & geeks</p>
      </div>
      <form id="join-form">
        <input type="text" id="username-input" placeholder="Pick a username..." maxlength="20" autocomplete="off" required>
        <button type="submit">Join Chat</button>
      </form>
    </div>
  </div>

  <!-- Chat Screen -->
  <div id="chat-screen" class="screen hidden">
    <header>
      <div class="header-left">
        <span class="logo-icon-sm">🎮</span>
        <h2>Friki Nights</h2>
      </div>
      <div class="header-right">
        <span id="user-count">0 online</span>
      </div>
    </header>

    <div class="chat-layout">
      <!-- Sidebar -->
      <aside id="sidebar">
        <h3>Online</h3>
        <ul id="user-list"></ul>
      </aside>

      <!-- Main Chat -->
      <main>
        <div id="messages"></div>
        <div id="typing-indicator" class="hidden"></div>
        <form id="message-form">
          <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off" maxlength="1000">
          <button type="submit">Send</button>
        </form>
      </main>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
